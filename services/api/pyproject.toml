[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "windward-api"
version = "0.1.0"
description = "Windward platform API: supervises the Sail engine and serves the HTTP contract."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

# Every dependency is pinned to an exact version. A floating or range pin is a
# defect per docs/adr/0001; scripts/check-toolchain-pins.sh enforces the Sail
# pin specifically, because that one also appears in the container images.
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  # The engine itself. The platform API is the parent of the Sail process
  # (ADR-0002), so the `sail` binary ships inside the API image.
  "pysail==0.7.3",
  # Spark Connect client for the interactive query path (ADR-0003). This is the
  # JVM-free client package; it is the version Sail 0.7.3 is tested against.
  "pyspark-client==4.2.0",
  "pyarrow==21.0.0",
  "pandas==2.2.3",
  # DuckDB: the warehouse dbt 2 projects build into (browsed read-only by the API).
  "duckdb==2.0.0",
  # Cron expressions for scheduled Jobs.
  "croniter==6.2.4",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-asyncio==1.3.0",
  "httpx==0.28.1",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["windward_api"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests start a real Sail engine; nothing here is mocked, so the
# suite is slower than a unit suite and the timeout has to allow a cold start.
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "integration: runs against a live Sail engine started by the test fixture",
]
